<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Exercise 6 - Build website layout using Bootstrap Grid</title>
    
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS tuỳ chỉnh cho nhãn "Sale" chéo góc */
        .card {
            position: relative;
            overflow: hidden; 
        }
        .sale-badge {
            position: absolute;
            top: 15px;
            right: -35px;
            background-color: #ff9800; /* Màu cam */
            color: white;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-size: 14px;
            font-weight: bold;
            z-index: 1;
            text-align: center;
        }
        
        /* CSS cho phần hiển thị giá tiền */
        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 12px;
        }
        .new-price {
            color: #ff9800;
            font-weight: bold;
            font-size: 14px;
        }
        .text-custom-gray {
            color: #777;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand text-secondary" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active text-secondary" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-primary" href="#">Link</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-secondary" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2 rounded-0" type="search" placeholder="Search">
                    <button class="btn btn-outline-primary rounded-0" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://placehold.co/1920x530/cccccc/777777?text=1920+x+530" class="d-block w-100" alt="Banner 1920x530">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div class="container my-5">
        <div class="mb-4">
            <h3 class="text-secondary fw-normal mb-1">NEW PRODUCT</h3>
            <p class="text-custom-gray fs-6">List product description</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            
            <div class="col">
                <div class="card h-100 rounded-0 border-light-subtle">
                    <img src="https://placehold.co/280x280/cccccc/777777?text=280+x+280" class="card-img-top rounded-0" alt="Product 1">
                    <div class="card-body">
                        <h6 class="card-title text-secondary fw-normal">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="old-price">100.000 vnđ</span>
                            <span class="new-price">80.000 vnđ</span>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-primary btn-sm rounded-0 px-3"><i class="fa-solid fa-cart-shopping"></i></button>
                            <button class="btn btn-outline-secondary btn-sm rounded-0 flex-grow-1">Xem chi tiết</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 rounded-0 border-light-subtle">
                    <img src="https://placehold.co/280x280/cccccc/777777?text=280+x+280" class="card-img-top rounded-0" alt="Product 2">
                    <div class="card-body">
                        <h6 class="card-title text-secondary fw-normal">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="old-price">100.000 vnđ</span>
                            <span class="new-price">80.000 vnđ</span>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-primary btn-sm rounded-0 px-3"><i class="fa-solid fa-cart-shopping"></i></button>
                            <button class="btn btn-outline-secondary btn-sm rounded-0 flex-grow-1">Xem chi tiết</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 rounded-0 border-light-subtle">
                    <img src="https://placehold.co/280x280/cccccc/777777?text=280+x+280" class="card-img-top rounded-0" alt="Product 3">
                    <div class="card-body">
                        <h6 class="card-title text-secondary fw-normal">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="old-price">100.000 vnđ</span>
                            <span class="new-price">80.000 vnđ</span>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-primary btn-sm rounded-0 px-3"><i class="fa-solid fa-cart-shopping"></i></button>
                            <button class="btn btn-outline-secondary btn-sm rounded-0 flex-grow-1">Xem chi tiết</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 rounded-0 border-light-subtle">
                    <div class="sale-badge">Sale</div>
                    <img src="https://placehold.co/280x280/cccccc/777777?text=280+x+280" class="card-img-top rounded-0" alt="Product 4">
                    <div class="card-body">
                        <h6 class="card-title text-secondary fw-normal">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="old-price">100.000 vnđ</span>
                            <span class="new-price">80.000 vnđ</span>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-primary btn-sm rounded-0 px-3"><i class="fa-solid fa-cart-shopping"></i></button>
                            <button class="btn btn-outline-secondary btn-sm rounded-0 flex-grow-1">Xem chi tiết</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
