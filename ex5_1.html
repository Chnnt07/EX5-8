<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Exercise 1 - Target Layout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .custom-container {
            max-width: 900px; 
            margin-top: 50px;
        }
        .header-box {
            background-color: #e9ecef; 
            padding: 50px 30px;
            margin-bottom: 25px;
        }
        .grid-box {
            background-color: #d3d3d3; 
            border: 1px solid #8e8e8e; 
            padding: 10px 15px;
            height: 100%;
        }
        .footer-box {
            background-color: #d2c0c0; 
            margin-top: 15px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }
        
        .row.g-0 [class*="col-"] {
            padding: 0;
        }
        .grid-box {
            margin-right: -1px;
            margin-bottom: -1px;
        }
    </style>
</head>
<body>

    <div class="container custom-container">
        
        <div class="header-box">
            <h1 class="display-6 fw-normal m-0">Let's test the grid!</h1>
        </div>

        <div class="row g-0">
            <div class="col-6"><div class="grid-box">First col</div></div>
            <div class="col-6"><div class="grid-box">Second col</div></div>
        </div>
        
        <div class="row g-0">
            <div class="col-4"><div class="grid-box">col</div></div>
            <div class="col-4"><div class="grid-box">col</div></div>
            <div class="col-4"><div class="grid-box">col</div></div>
        </div>
        
        <div class="row g-0">
            <div class="col-3"><div class="grid-box">col</div></div>
            <div class="col-3"><div class="grid-box">col</div></div>
            <div class="col-3"><div class="grid-box">col</div></div>
            <div class="col-3"><div class="grid-box">col</div></div>
        </div>

        <div class="footer-box">
            Created by ABC!
        </div>

    </div>

</body>
</html>
